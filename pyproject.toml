[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "solvex"
version = "0.1.0"
description = "Solvex: plataforma de resolución de problemas en Investigación de Operaciones"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["PySide6>=6.6"]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.5",
    "mypy>=1.10",
    "networkx>=3.2",
    "scipy>=1.11",
]
empaque = ["pyinstaller>=6"]

[project.gui-scripts]
solvex = "plataforma_io.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["gui: pruebas que requieren PySide6 (se ejecutan con QT_QPA_PLATFORM=offscreen)"]

[tool.coverage.run]
source = ["plataforma_io.motor"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "plataforma_io.motor.*"
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
warn_return_any = true
no_implicit_optional = true
